name: Captive portal tests

on:
  push:
    paths:
      - ".github/workflows/captive-portal-tests.yml"
      - "firmware/captive-portal/**"
      - "firmware/esphome/components/captive_portal/**"
      - "tests/test_captive_portal_contract.py"
  pull_request:
    paths:
      - "firmware/captive-portal/**"
      - "firmware/esphome/components/captive_portal/**"
      - "tests/test_captive_portal_contract.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run captive portal regression tests
        run: python3 tests/test_captive_portal_contract.py

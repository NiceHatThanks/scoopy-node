# ============================================================
# Scoopy Node - Unified Firmware
# ============================================================
#
# Hardware:
#
#   GPIO0  - LD2410C TX to UART RX
#   GPIO1  - LD2410C RX to UART TX
#   GPIO2  - Button 1
#   GPIO3  - Button 2
#   GPIO4  - Left green LED
#   GPIO5  - I2C SDA
#   GPIO6  - Middle red LED
#   GPIO7  - I2C SCL
#   GPIO10 - Right green LED
#
# The same firmware is intended for both:
#
#   Scoopy Compact
#   Scoopy Presence
#
# If an LD2410C is not fitted, its entities will remain Unknown
# while the rest of Scoopy continues operating normally.
#
# First-time setup:
#
#   1. Device creates a Wi-Fi AP named scoopy-XXXXXX
#   2. Customer connects using password: scoopy123
#   3. Captive portal is used to enter home Wi-Fi credentials
#   4. Home Assistant discovers Scoopy through ESPHome
#
# Recovery:
#
#   Hold both buttons for 10 seconds to factory-reset Wi-Fi
#   credentials and return Scoopy to setup mode.
#
# ============================================================


# ============================================================
# Device identity
# ============================================================

esphome:
  name: scoopy
  friendly_name: Scoopy

  # Adds the final six hexadecimal digits of the ESP32 MAC
  # address to the device name.
  #
  # Example:
  #   scoopy-2176d8
  #
  # This gives every Scoopy a unique identity while allowing
  # every device to use exactly the same firmware image.
  name_add_mac_suffix: true

  # Nice Hat Thanks firmware identity. This is separate from the
  # ESPHome framework version and lets Home Assistant show the
  # Scoopy firmware release installed on the device.
  project:
    name: "nicehatthanks.scoopy"
    version: "0.1.3"

  # Start the red setup pulse once components have initialised.
  # If Wi-Fi is already connected, leave the LEDs off.
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - light.turn_on:
                id: middle_led
                brightness: 100%
                effect: "Pulse Bright"


# ============================================================
# ESP32-C3
# ============================================================

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf


# ============================================================
# Scoopy custom components
# ============================================================

# Override only ESPHome's captive_portal component so Scoopy
# can use the branded setup page while retaining ESPHome's
# normal Wi-Fi storage, DNS and captive-portal behaviour.
external_components:
  - source:
      type: local
      path: components
    components:
      - captive_portal


# ============================================================
# Logging / Home Assistant / OTA
# ============================================================

logger:

api:

  # The ESP32-C3 is single-core, so Wi-Fi and BLE scanning
  # share CPU/radio time. Only run BLE scanning while a
  # Home Assistant state-subscribing API client is connected
  # and the customer has enabled the Bluetooth Proxy switch.
  on_client_connected:
    - if:
        condition:
          and:
            - switch.is_on: bluetooth_proxy_enabled
            # on_client_connected fires before Home Assistant has
            # necessarily subscribed to entity states, so identify
            # the HA client directly rather than racing that subscription.
            - lambda: |-
                return client_info.rfind("Home Assistant", 0) == 0;
        then:
          - esp32_ble_tracker.start_scan:
              continuous: true

  # This trigger also fires for short-lived clients such as the
  # ESPHome log viewer. Only stop scanning when no Home Assistant
  # state-subscribing API client remains connected.
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - esp32_ble_tracker.stop_scan:


# ============================================================
# Bluetooth LE / Home Assistant Bluetooth Proxy
# ============================================================

# Use passive BLE scanning to minimise Wi-Fi/BLE contention on the
# single-core ESP32-C3.
#
# Continuous scanning is disabled at component startup so BLE does
# not compete with Wi-Fi while Scoopy is booting or being provisioned.
# The Home Assistant switch below starts a continuous passive scan
# only while Home Assistant is connected. Default ESPHome scan
# interval/window values are deliberately retained for Wi-Fi stability.
esp32_ble_tracker:
  scan_parameters:
    active: false
    continuous: false


# Forward nearby BLE devices to Home Assistant.
#
# active: true allows Home Assistant integrations to create proxied
# BLE/GATT connections through Scoopy when required, while scanning
# itself remains passive.
#
# A single connection slot keeps RAM and radio overhead modest on the
# ESP32-C3 while still allowing devices such as LD2410 BLE sensors to
# be connected to and exposed normally in Home Assistant.
bluetooth_proxy:
  active: true
  connection_slots: 1

# Customer-facing control for BLE scanning.
#
# The preference is stored in flash. A new Scoopy defaults to OFF,
# preserving the existing Wi-Fi/CPU behaviour until the customer opts in.
# If Home Assistant disconnects, scanning stops automatically but this
# switch remains ON, so scanning resumes when Home Assistant reconnects.
switch:
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_enabled
    icon: "mdi:bluetooth"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

    turn_on_action:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - esp32_ble_tracker.start_scan:
                continuous: true

    turn_off_action:
      - esp32_ble_tracker.stop_scan:


# Allows Scoopy to download firmware and update manifests
# directly from the Nice Hat Thanks website.
http_request:


# Keep native ESPHome OTA for development/local updates,
# while also allowing customer-facing HTTP firmware updates.
ota:
  - platform: esphome

  - platform: http_request


# Managed firmware update entity exposed to Home Assistant.
# Scoopy periodically checks this manifest for a newer release.
update:
  - platform: http_request
    name: "Firmware Update"
    source: "https://nicehatthanks.com/firmware/scoopy/manifest.json"
    entity_category: diagnostic


# ============================================================
# Wi-Fi provisioning
# ============================================================

wifi:
  id: wifi_component

  # No normal SSID/password is compiled into production
  # firmware.
  #
  # A fresh or factory-reset Scoopy creates its own setup AP.
  # Because no SSID is explicitly supplied here, ESPHome uses
  # the MAC-suffixed Scoopy device name.
  ap:
    password: "scoopy123"

  # Once Wi-Fi successfully connects, stop the red setup pulse
  # and play a brief green success flash before leaving LEDs off.
  on_connect:
    then:
      - script.execute: wifi_connected_success

  # If Scoopy loses Wi-Fi, stop any coordinated HA pattern and
  # use the middle red LED as the setup/status indicator.
  on_disconnect:
    then:
      - light.turn_off: led_pattern
      - light.turn_on:
          id: middle_led
          brightness: 100%
          effect: "Pulse Bright"


# Provides the first-time Wi-Fi setup page.
captive_portal:


# Also allows provisioning over USB serial using Improv.
improv_serial:


# ============================================================
# Wi-Fi connected success animation
# ============================================================

# A short one-shot confirmation when Scoopy joins Wi-Fi:
# both green LEDs fade up together, hold briefly, then fade out.
# The script also stops any coordinated pattern and the red setup
# pulse first so only the success indication owns the LEDs.

script:
  - id: wifi_connected_success
    mode: restart
    then:
      - light.turn_off: led_pattern

      - light.turn_off:
          id: middle_led
          transition_length: 0s

      - light.turn_on:
          id: left_led
          brightness: 100%
          transition_length: 150ms

      - light.turn_on:
          id: right_led
          brightness: 100%
          transition_length: 150ms

      - delay: 250ms

      - light.turn_off:
          id: left_led
          transition_length: 350ms

      - light.turn_off:
          id: right_led
          transition_length: 350ms


# ============================================================
# LD2410C mmWave radar
# ============================================================

# UART is always enabled so one firmware image can support
# both Scoopy Compact and Scoopy Presence.
#
# ESP TX -> LD2410 RX
# ESP RX <- LD2410 TX

uart:
  id: radar_uart
  tx_pin: GPIO1
  rx_pin: GPIO0
  baud_rate: 256000
  parity: NONE
  stop_bits: 1


ld2410:
  id: radar
  uart_id: radar_uart


# ============================================================
# I2C expansion
# ============================================================

# Generic I2C expansion bus.
#
# Users can add their own ESPHome-supported I2C
# peripherals without modifying Scoopy hardware.

i2c:
  id: scoopy_i2c
  sda: GPIO5
  scl: GPIO7
  scan: true


# ============================================================
# LD2410C distance sensors
# ============================================================

sensor:


#   # LD2410 distance sensors are intentionally disabled by default.
#   # These values update frequently and can create a large amount of
#   # unnecessary Home Assistant Recorder/history data over time.
#   # Uncomment this block if live presence distance data is required.

#   - platform: ld2410
#     ld2410_id: radar

#     # Distance entities can change frequently, so publish them
#     # at most once every five seconds to reduce unnecessary
#     # Home Assistant Recorder/history traffic.

#     detection_distance:
#       name: "Presence Distance"
#       filters:
#         - throttle: 2s

#     moving_distance:
#       name: "Moving Distance"
#       filters:
#         - throttle: 2s

#     still_distance:
#       name: "Still Distance"
#       filters:
#         - throttle: 2s


  # ----------------------------------------------------------
  # Diagnostics
  # ----------------------------------------------------------

  # Raw Wi-Fi RSSI in dBm. ESPHome only reports a valid value
  # while connected in station mode.
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  # Friendlier 0-100% representation of the same RSSI value.
  - platform: copy
    source_id: wifi_signal_db
    name: "Wi-Fi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic
    device_class: ""

  # Device uptime in seconds. Home Assistant treats this as a
  # diagnostic entity rather than a normal room-control sensor.
  - platform: uptime
    name: "Uptime"
    type: seconds
    update_interval: 60s
    entity_category: diagnostic


# ============================================================
# Diagnostic text sensors
# ============================================================

text_sensor:

  # Current IP address assigned by the customer's network.
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

  # ESPHome framework version the firmware was compiled with.
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true
    entity_category: diagnostic

  # Scoopy product firmware version, independent of ESPHome.
  - platform: template
    name: "Scoopy Firmware"
    id: scoopy_firmware_version
    icon: "mdi:information-outline"
    entity_category: diagnostic
    update_interval: 600s
    lambda: |-
      return { ESPHOME_PROJECT_VERSION };


# ============================================================
# LED PWM outputs
# ============================================================

# All three LEDs use ESP32 LEDC PWM so Home Assistant can set
# brightness as well as effects.

output:
  - platform: ledc
    pin: GPIO4
    id: left_led_output

  - platform: ledc
    pin: GPIO6
    id: middle_led_output

  - platform: ledc
    pin: GPIO10
    id: right_led_output

  # Virtual output used by the Home Assistant "LED Pattern"
  # light. In normal/static mode it drives all three LEDs together.
  # Custom effects can then take direct control of the three PWM
  # outputs to create coordinated patterns.
  - platform: template
    id: led_pattern_output
    type: float
    write_action:
      - lambda: |-
          id(left_led_output).set_level(state);
          id(middle_led_output).set_level(state);
          id(right_led_output).set_level(state);


# ============================================================
# Home Assistant LED entities
# ============================================================

light:

  # ----------------------------------------------------------
  # Coordinated three-LED patterns
  # ----------------------------------------------------------

  - platform: monochromatic
    name: "LED Pattern"
    id: led_pattern
    output: led_pattern_output
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    gamma_correct: 1.0

    # LED ownership rule:
    # the coordinated LED Pattern entity and the three individual
    # LED entities are mutually exclusive. As soon as a coordinated
    # pattern is turned on, stop all individual LED states/effects
    # before the pattern takes control of the raw PWM outputs.
    on_turn_on:
      - light.turn_off:
          id: left_led
          transition_length: 0s
      - light.turn_off:
          id: middle_led
          transition_length: 0s
      - light.turn_off:
          id: right_led
          transition_length: 0s

    effects:
      - lambda:
          name: "Circular Pulse"
          update_interval: 33ms
          lambda: |-
            static uint32_t started_ms = 0;

            if (initial_run) {
              started_ms = millis();

              // The pattern takes ownership of the three LEDs.
              // Keep the individual HA LED entities in a clean OFF
              // state while the pattern drives the raw PWM outputs.
              id(left_led).turn_off().set_transition_length(0).perform();
              id(middle_led).turn_off().set_transition_length(0).perform();
              id(right_led).turn_off().set_transition_length(0).perform();
            }

            constexpr float CYCLE_MS = 1800.0f;

            const float elapsed_ms = static_cast<float>(millis() - started_ms);
            const float phase = fmodf(elapsed_ms / CYCLE_MS, 1.0f);

            // The LED Pattern light's HA brightness slider controls
            // the peak brightness of the whole animation.
            const float peak = it.current_values.get_brightness();

            auto pulse = [](float p) -> float {
              constexpr float TWO_PI_LOCAL = 6.28318530718f;
              float wave = 0.5f + 0.5f * cosf(TWO_PI_LOCAL * p);

              // Squaring narrows the pulse while keeping the motion
              // smooth, giving a clear left -> middle -> right chase.
              return wave * wave;
            };

            const float left = peak * pulse(phase);
            const float middle = peak * pulse(phase - (1.0f / 3.0f));
            const float right = peak * pulse(phase - (2.0f / 3.0f));

            id(left_led_output).set_level(left);
            id(middle_led_output).set_level(middle);
            id(right_led_output).set_level(right);


      - lambda:
          name: "Comet"
          update_interval: 33ms
          lambda: |-
            static uint32_t started_ms = 0;

            if (initial_run) {
              started_ms = millis();

              id(left_led).turn_off().set_transition_length(0).perform();
              id(middle_led).turn_off().set_transition_length(0).perform();
              id(right_led).turn_off().set_transition_length(0).perform();
            }

            constexpr float CYCLE_MS = 1500.0f;
            constexpr float PI_LOCAL = 3.14159265359f;
            constexpr float TAIL = 0.22f;

            const float elapsed_ms = static_cast<float>(millis() - started_ms);
            const float phase = fmodf(elapsed_ms / CYCLE_MS, 1.0f);
            const float peak = it.current_values.get_brightness();

            // Move a bright "head" through the three LEDs while the
            // previous LED fades away as a short tail.
            const float position = phase * 3.0f;
            const int current = static_cast<int>(floorf(position)) % 3;
            const int next = (current + 1) % 3;
            const int previous = (current + 2) % 3;
            const float fraction = position - floorf(position);

            // Cosine easing keeps the transfer between LEDs smooth.
            const float eased = 0.5f - 0.5f * cosf(PI_LOCAL * fraction);

            float levels[3] = {0.0f, 0.0f, 0.0f};
            levels[current] = TAIL + (1.0f - TAIL) * (1.0f - eased);
            levels[next] = eased;
            levels[previous] = TAIL * (1.0f - eased);

            id(left_led_output).set_level(peak * levels[0]);
            id(middle_led_output).set_level(peak * levels[1]);
            id(right_led_output).set_level(peak * levels[2]);


      - lambda:
          name: "Breathe All"
          update_interval: 33ms
          lambda: |-
            static uint32_t started_ms = 0;

            if (initial_run) {
              started_ms = millis();

              id(left_led).turn_off().set_transition_length(0).perform();
              id(middle_led).turn_off().set_transition_length(0).perform();
              id(right_led).turn_off().set_transition_length(0).perform();
            }

            constexpr float CYCLE_MS = 3000.0f;
            constexpr float TWO_PI_LOCAL = 6.28318530718f;
            constexpr float MIN_LEVEL = 0.06f;

            const float elapsed_ms = static_cast<float>(millis() - started_ms);
            const float phase = fmodf(elapsed_ms / CYCLE_MS, 1.0f);
            const float peak = it.current_values.get_brightness();

            // Smoothly breathe all three LEDs together without quite
            // reaching zero, so the animation remains visibly alive.
            const float wave = 0.5f - 0.5f * cosf(TWO_PI_LOCAL * phase);
            const float level = peak * (MIN_LEVEL + (1.0f - MIN_LEVEL) * wave);

            id(left_led_output).set_level(level);
            id(middle_led_output).set_level(level);
            id(right_led_output).set_level(level);


      - lambda:
          name: "Heartbeat"
          update_interval: 25ms
          lambda: |-
            static uint32_t started_ms = 0;

            if (initial_run) {
              started_ms = millis();

              id(left_led).turn_off().set_transition_length(0).perform();
              id(middle_led).turn_off().set_transition_length(0).perform();
              id(right_led).turn_off().set_transition_length(0).perform();
            }

            constexpr float CYCLE_MS = 1500.0f;
            constexpr float PI_LOCAL = 3.14159265359f;

            const float elapsed_ms = static_cast<float>(millis() - started_ms);
            const float phase = fmodf(elapsed_ms / CYCLE_MS, 1.0f);
            const float peak = it.current_values.get_brightness();

            auto beat = [](float p, float centre, float half_width) -> float {
              constexpr float PI_BEAT = 3.14159265359f;
              const float distance = fabsf(p - centre);

              if (distance >= half_width)
                return 0.0f;

              const float x = distance / half_width;
              return 0.5f + 0.5f * cosf(PI_BEAT * x);
            };

            // A strong first beat followed quickly by a slightly
            // softer second beat, then a longer pause.
            const float first = beat(phase, 0.11f, 0.075f);
            const float second = 0.78f * beat(phase, 0.29f, 0.065f);
            const float level = peak * fmaxf(first, second);

            id(left_led_output).set_level(level);
            id(middle_led_output).set_level(level);
            id(right_led_output).set_level(level);


      - lambda:
          name: "Ping Pong"
          update_interval: 33ms
          lambda: |-
            static uint32_t started_ms = 0;

            if (initial_run) {
              started_ms = millis();

              id(left_led).turn_off().set_transition_length(0).perform();
              id(middle_led).turn_off().set_transition_length(0).perform();
              id(right_led).turn_off().set_transition_length(0).perform();
            }

            constexpr float CYCLE_MS = 1800.0f;
            constexpr float PI_LOCAL = 3.14159265359f;

            const float elapsed_ms = static_cast<float>(millis() - started_ms);
            const float phase = fmodf(elapsed_ms / CYCLE_MS, 1.0f);
            const float peak = it.current_values.get_brightness();

            // Triangle-wave position: 0 -> 2 -> 0 gives a smooth
            // left -> red -> right -> red -> left bounce.
            const float position =
                phase < 0.5f ? phase * 4.0f : (1.0f - phase) * 4.0f;

            float left = 0.0f;
            float middle = 0.0f;
            float right = 0.0f;

            if (position <= 1.0f) {
              const float eased = 0.5f - 0.5f * cosf(PI_LOCAL * position);
              left = 1.0f - eased;
              middle = eased;
            } else {
              const float local = position - 1.0f;
              const float eased = 0.5f - 0.5f * cosf(PI_LOCAL * local);
              middle = 1.0f - eased;
              right = eased;
            }

            id(left_led_output).set_level(peak * left);
            id(middle_led_output).set_level(peak * middle);
            id(right_led_output).set_level(peak * right);


      - lambda:
          name: "Ripple"
          update_interval: 33ms
          lambda: |-
            static uint32_t started_ms = 0;

            if (initial_run) {
              started_ms = millis();

              id(left_led).turn_off().set_transition_length(0).perform();
              id(middle_led).turn_off().set_transition_length(0).perform();
              id(right_led).turn_off().set_transition_length(0).perform();
            }

            constexpr float CYCLE_MS = 1800.0f;

            const float elapsed_ms = static_cast<float>(millis() - started_ms);
            const float phase = fmodf(elapsed_ms / CYCLE_MS, 1.0f);
            const float peak = it.current_values.get_brightness();

            auto ripple_pulse = [](float p, float centre, float half_width) -> float {
              constexpr float PI_RIPPLE = 3.14159265359f;

              float distance = fabsf(p - centre);
              distance = fminf(distance, 1.0f - distance);

              if (distance >= half_width)
                return 0.0f;

              const float x = distance / half_width;
              return 0.5f + 0.5f * cosf(PI_RIPPLE * x);
            };

            // The centre red LED blooms first, then the pulse expands
            // outward into both green LEDs before fading away.
            const float middle = peak * ripple_pulse(phase, 0.20f, 0.18f);
            const float outer = peak * ripple_pulse(phase, 0.55f, 0.25f);

            id(left_led_output).set_level(outer);
            id(middle_led_output).set_level(middle);
            id(right_led_output).set_level(outer);


  # ----------------------------------------------------------
  # Left green LED
  # ----------------------------------------------------------

  - platform: monochromatic
    name: "Left LED"
    id: left_led
    output: left_led_output
    restore_mode: ALWAYS_OFF

    # If an individual LED is turned on while a coordinated pattern
    # is active, stop the pattern first. Turning LED Pattern off drives
    # all three raw PWM outputs to 0 immediately, then this individual
    # light/effect can take ownership cleanly.
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return id(led_pattern).remote_values.is_on();
          then:
            - light.turn_off:
                id: led_pattern
                transition_length: 0s

    effects:
      - pulse:
          name: "Pulse Dim"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 5%
          max_brightness: 25%

      - pulse:
          name: "Pulse Mid"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 8%
          max_brightness: 60%

      - pulse:
          name: "Pulse Bright"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 10%
          max_brightness: 100%

      - strobe:
          name: "Flash Dim"
          colors:
            - state: true
              brightness: 25%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Flash Mid"
          colors:
            - state: true
              brightness: 60%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Flash Bright"
          colors:
            - state: true
              brightness: 100%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Alert"
          colors:
            - state: true
              brightness: 100%
              duration: 150ms
            - state: false
              duration: 150ms


  # ----------------------------------------------------------
  # Middle red LED
  #
  # This LED doubles as Scoopy's setup/recovery indicator.
  # Once Wi-Fi is connected, it behaves as a normal HA light.
  # ----------------------------------------------------------

  - platform: monochromatic
    name: "Middle LED"
    id: middle_led
    output: middle_led_output
    restore_mode: ALWAYS_OFF

    # If an individual LED is turned on while a coordinated pattern
    # is active, stop the pattern first. Turning LED Pattern off drives
    # all three raw PWM outputs to 0 immediately, then this individual
    # light/effect can take ownership cleanly.
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return id(led_pattern).remote_values.is_on();
          then:
            - light.turn_off:
                id: led_pattern
                transition_length: 0s

    effects:
      - pulse:
          name: "Pulse Dim"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 5%
          max_brightness: 25%

      - pulse:
          name: "Pulse Mid"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 8%
          max_brightness: 60%

      - pulse:
          name: "Pulse Bright"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 10%
          max_brightness: 100%

      - strobe:
          name: "Flash Dim"
          colors:
            - state: true
              brightness: 25%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Flash Mid"
          colors:
            - state: true
              brightness: 60%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Flash Bright"
          colors:
            - state: true
              brightness: 100%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Alert"
          colors:
            - state: true
              brightness: 100%
              duration: 150ms
            - state: false
              duration: 150ms


  # ----------------------------------------------------------
  # Right green LED
  # ----------------------------------------------------------

  - platform: monochromatic
    name: "Right LED"
    id: right_led
    output: right_led_output
    restore_mode: ALWAYS_OFF

    # If an individual LED is turned on while a coordinated pattern
    # is active, stop the pattern first. Turning LED Pattern off drives
    # all three raw PWM outputs to 0 immediately, then this individual
    # light/effect can take ownership cleanly.
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return id(led_pattern).remote_values.is_on();
          then:
            - light.turn_off:
                id: led_pattern
                transition_length: 0s

    effects:
      - pulse:
          name: "Pulse Dim"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 5%
          max_brightness: 25%

      - pulse:
          name: "Pulse Mid"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 8%
          max_brightness: 60%

      - pulse:
          name: "Pulse Bright"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 10%
          max_brightness: 100%

      - strobe:
          name: "Flash Dim"
          colors:
            - state: true
              brightness: 25%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Flash Mid"
          colors:
            - state: true
              brightness: 60%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Flash Bright"
          colors:
            - state: true
              brightness: 100%
              duration: 500ms
            - state: false
              duration: 500ms

      - strobe:
          name: "Alert"
          colors:
            - state: true
              brightness: 100%
              duration: 150ms
            - state: false
              duration: 150ms


# ============================================================
# Factory reset
# ============================================================

# Internal ESPHome factory-reset control.
#
# It is deliberately hidden from Home Assistant and only
# invoked by the physical two-button recovery gesture.

button:
  - platform: factory_reset
    id: factory_reset_button
    internal: true


# ============================================================
# Internal state used for factory reset indication
# ============================================================

globals:

  # The reset logic runs every 250 ms.
  #
  # 40 * 250 ms = 10 seconds.
  - id: factory_reset_hold_count
    type: int
    restore_value: no
    initial_value: "0"


# ============================================================
# Wi-Fi LED pattern + factory reset monitor
# ============================================================

interval:
  - interval: 250ms
    then:

      # ------------------------------------------------------
      # Track simultaneous button hold
      # ------------------------------------------------------

      - if:
          condition:
            and:
              - binary_sensor.is_on: button_1
              - binary_sensor.is_on: button_2

          then:
            - lambda: |-
                id(factory_reset_hold_count)++;

          else:
            - lambda: |-
                id(factory_reset_hold_count) = 0;


      # ------------------------------------------------------
      # Factory reset warning LED
      # ------------------------------------------------------

      # During the final three seconds of the reset gesture,
      # temporarily override the normal middle LED behaviour.

      - if:
          condition:
            lambda: |-
              return id(factory_reset_hold_count) >= 36;

          then:
            # 9-10 seconds: very fast warning blink.
            - light.toggle: middle_led

          else:
            - if:
                condition:
                  lambda: |-
                    return id(factory_reset_hold_count) >= 28;

                then:
                  # Entering the reset warning phase: stop the
                  # normal Wi-Fi pulse before manually blinking red.
                  - if:
                      condition:
                        lambda: |-
                          return id(factory_reset_hold_count) == 28 &&
                                 id(middle_led).current_values.is_on();

                      then:
                        - light.turn_off: middle_led

                  # 7-9 seconds: slower warning blink.
                  - lambda: |-
                      static bool reset_fast_toggle = false;
                      reset_fast_toggle = !reset_fast_toggle;

                      if (reset_fast_toggle) {
                        if (id(middle_led).current_values.is_on()) {
                          id(middle_led).turn_off().perform();
                        } else {
                          id(middle_led).turn_on().perform();
                        }
                      }

                else:

                  # ------------------------------------------------
                  # Setup / Wi-Fi status
                  # ------------------------------------------------

                  # When Scoopy is offline, keep the middle red
                  # LED pulsing. If the reset warning temporarily took
                  # over, this restores the Wi-Fi pulse afterwards.
                  - if:
                      condition:
                        not:
                          wifi.connected:

                      then:
                        - if:
                            condition:
                              lambda: |-
                                return !id(middle_led).current_values.is_on();

                            then:
                              - light.turn_on:
                                  id: middle_led
                                  brightness: 100%
                                  effect: "Pulse Bright"


      # ------------------------------------------------------
      # Factory reset after 10 seconds
      # ------------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(factory_reset_hold_count) >= 40;

          then:
            - logger.log:
                level: WARN
                format: "Factory reset requested - both buttons held for 10 seconds"

            - button.press: factory_reset_button


# ============================================================
# Home Assistant button events
# ============================================================

# The physical GPIO states are hidden from Home Assistant.
#
# Customers instead see clean Button 1 / Button 2 event
# entities supporting:
#
#   single
#   double
#   hold

event:
  - platform: template
    name: "Button 1"
    id: button_1_event
    device_class: button
    event_types:
      - single
      - double
      - hold

  - platform: template
    name: "Button 2"
    id: button_2_event
    device_class: button
    event_types:
      - single
      - double
      - hold


# ============================================================
# Physical buttons + presence
# ============================================================

binary_sensor:

  # ----------------------------------------------------------
  # LD2410C
  # ----------------------------------------------------------

  # Presence itself is deliberately NOT throttled.
  #
  # Home Assistant automations therefore receive presence
  # changes immediately.

  - platform: ld2410
    ld2410_id: radar

    has_target:
      name: "Presence"

    has_moving_target:
      name: "Moving Target"

    has_still_target:
      name: "Still Target"


  # ----------------------------------------------------------
  # Button 1 - GPIO2
  # ----------------------------------------------------------

  - platform: gpio
    id: button_1
    internal: true

    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 20ms

    on_multi_click:

      # Double press.
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 200ms

        then:
          - event.trigger:
              id: button_1_event
              event_type: double


      # Hold.
      #
      # If Button 2 is also held, suppress the normal HA hold
      # event because the user may be performing a factory
      # reset gesture instead.
      - timing:
          - ON for at least 800ms

        then:
          - if:
              condition:
                binary_sensor.is_off: button_2

              then:
                - event.trigger:
                    id: button_1_event
                    event_type: hold


      # Single press.
      - timing:
          - ON for at most 500ms
          - OFF for at least 450ms

        then:
          - event.trigger:
              id: button_1_event
              event_type: single


  # ----------------------------------------------------------
  # Button 2 - GPIO3
  # ----------------------------------------------------------

  - platform: gpio
    id: button_2
    internal: true

    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 20ms

    on_multi_click:

      # Double press.
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 200ms

        then:
          - event.trigger:
              id: button_2_event
              event_type: double


      # Hold.
      #
      # Suppressed when Button 1 is also being held for the
      # factory-reset gesture.
      - timing:
          - ON for at least 800ms

        then:
          - if:
              condition:
                binary_sensor.is_off: button_1

              then:
                - event.trigger:
                    id: button_2_event
                    event_type: hold


      # Single press.
      - timing:
          - ON for at most 500ms
          - OFF for at least 450ms

        then:
          - event.trigger:
              id: button_2_event
              event_type: single
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f1">
  <title>Scoopy Setup</title>
  <style>
    :root {
      --bg: #fff9f1;
      --card: #fffdf9;
      --ink: #2d2926;
      --muted: #77706b;
      --border: #e7ded4;
      --accent: #ef8fa7;
      --accent-hover: #e47f99;
      --accent-soft: #fde8ee;
      --mint: #b8d8c0;
      --shadow: 0 14px 40px rgba(83, 67, 53, 0.10);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .shell {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(231, 222, 212, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      height: 10px;
      background: linear-gradient(90deg, var(--mint) 0 33.333%, var(--accent) 33.333% 66.666%, #f1d5a7 66.666% 100%);
    }

    .content {
      padding: 32px 28px 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .scoop-mark {
      width: 42px;
      height: 42px;
      border-radius: 50% 50% 45% 45%;
      background: var(--accent-soft);
      border: 2px solid var(--accent);
      position: relative;
      flex: 0 0 auto;
    }

    .scoop-mark::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 10px;
      left: 8px;
      bottom: -8px;
      border-radius: 0 0 10px 10px;
      background: #f1d5a7;
      border: 2px solid #d9bd90;
      border-top: 0;
    }

    .brand-name {
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 10px auto 26px;
      max-width: 320px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      padding: 0 14px;
      outline: none;
      appearance: none;
    }

    select {
      padding-right: 42px;
      background-image:
        linear-gradient(45deg, transparent 50%, #7d756f 50%),
        linear-gradient(135deg, #7d756f 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 22px,
        calc(100% - 15px) 22px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(239, 143, 167, 0.14);
    }

    .manual {
      margin-top: 8px;
      border: 0;
      padding: 0;
      background: none;
      color: #8c5967;
      font: inherit;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .manual-field {
      display: none;
      margin-top: 12px;
    }

    .manual-field.visible {
      display: block;
    }

    .connect {
      width: 100%;
      min-height: 52px;
      margin-top: 7px;
      border: 0;
      border-radius: 15px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(239, 143, 167, 0.28);
    }

    .connect:hover,
    .connect:focus-visible {
      background: var(--accent-hover);
    }

    .connect:active {
      transform: translateY(1px);
    }

    .device {
      margin: 22px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .device strong {
      color: var(--ink);
      font-weight: 650;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 13px;
      background: #f2f7f2;
      color: #48634f;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .status.visible {
      display: block;
    }

    .footer {
      margin: 16px 0 0;
      text-align: center;
      color: #9a928c;
      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 420px) {
      body {
        align-items: flex-start;
        padding-top: 14px;
      }

      .content {
        padding: 28px 22px 22px;
      }

      .card {
        border-radius: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="welcome-title">
      <div class="topbar" aria-hidden="true"></div>

      <div class="content">
        <div class="brand" aria-label="Scoopy">
          <span class="scoop-mark" aria-hidden="true"></span>
          <span class="brand-name">Scoopy</span>
        </div>

        <h1 id="welcome-title">Welcome to Scoopy!</h1>
        <p class="intro">Let's get your Scoopy connected to Wi-Fi.</p>

        <form id="wifi-form">
          <div class="field">
            <label for="wifi-network">Wi-Fi network</label>
            <select id="wifi-network" name="ssid">
              <option value="">Choose a network</option>
              <option value="Home WiFi">Home WiFi</option>
              <option value="Kitchen 2.4 GHz">Kitchen 2.4 GHz</option>
              <option value="Scoopy Test Network">Scoopy Test Network</option>
            </select>

            <button class="manual" id="manual-toggle" type="button">Can't see your network?</button>

            <div class="manual-field" id="manual-field">
              <label for="manual-ssid">Network name</label>
              <input id="manual-ssid" type="text" autocomplete="off" placeholder="Enter Wi-Fi name">
            </div>
          </div>

          <div class="field">
            <label for="wifi-password">Password</label>
            <input id="wifi-password" name="psk" type="password" autocomplete="current-password" placeholder="Wi-Fi password">
          </div>

          <button class="connect" type="submit">Connect Scoopy</button>
        </form>

        <div class="status" id="status" role="status" aria-live="polite">
          Connecting Scoopy… You can close this window once Scoopy joins your Wi-Fi.
        </div>

        <p class="device">Device: <strong id="device-name">scoopy-2176d8</strong></p>
      </div>
    </section>

    <p class="footer">Scoopy Node · Open-source smart room control</p>
  </main>

  <script>
    const manualToggle = document.getElementById('manual-toggle');
    const manualField = document.getElementById('manual-field');
    const manualSsid = document.getElementById('manual-ssid');
    const networkSelect = document.getElementById('wifi-network');
    const form = document.getElementById('wifi-form');
    const status = document.getElementById('status');

    manualToggle.addEventListener('click', () => {
      const visible = manualField.classList.toggle('visible');
      manualToggle.textContent = visible ? 'Choose from scanned networks' : "Can't see your network?";

      if (visible) {
        networkSelect.value = '';
        manualSsid.focus();
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      status.classList.add('visible');
    });
  </script>
</body>
</html>

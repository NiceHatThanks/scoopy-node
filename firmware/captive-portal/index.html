<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F0E6">
  <title>Scoopy Setup</title>

  <style>
    :root {
      --cream: #F5F0E6;
      --cream-light: #FBF8F1;
      --ink: #1C211B;
      --pink: #E496B3;
      --pink-soft: #F5D8E3;
      --blue: #B6D6EB;
      --blue-soft: #DFECF5;
      --muted: #687067;
      --border: rgba(28, 33, 27, 0.14);
      --shadow: 0 22px 60px rgba(28, 33, 27, 0.10);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .page-decoration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 999px;
      opacity: 0.75;
    }

    .blob-pink {
      width: 190px;
      height: 190px;
      top: -70px;
      right: -55px;
      background: var(--pink-soft);
    }

    .blob-blue {
      width: 220px;
      height: 220px;
      left: -90px;
      bottom: -80px;
      background: var(--blue-soft);
    }

    .shell {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--cream-light);
      border: 1px solid rgba(28, 33, 27, 0.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .accent-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 8px;
    }

    .accent-pink { background: var(--pink); }
    .accent-blue { background: var(--blue); }

    .content { padding: 34px 30px 28px; }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-name {
      font-size: 31px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .intro {
      max-width: 310px;
      margin: 10px auto 30px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--cream);
      color: var(--ink);
      padding: 0 15px;
      font: inherit;
      font-size: 16px;
      outline: none;
      appearance: none;
    }

    input::placeholder { color: #92988F; }

    select {
      padding-right: 44px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--ink) 50%),
        linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 23px,
        calc(100% - 15px) 23px;
      background-size: 5px 5px;
      background-repeat: no-repeat;
    }

    select:focus,
    input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(228, 150, 179, 0.18);
    }

    .manual {
      margin-top: 9px;
      border: 0;
      padding: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--pink);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .manual-field {
      display: none;
      margin-top: 14px;
    }

    .manual-field.visible { display: block; }

    .connect {
      width: 100%;
      min-height: 54px;
      margin-top: 6px;
      border: 0;
      border-radius: 16px;
      background: var(--ink);
      color: var(--cream);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(28, 33, 27, 0.16);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .connect:hover,
    .connect:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 11px 24px rgba(28, 33, 27, 0.20);
    }

    .connect:active { transform: translateY(1px); }

    .connect:disabled {
      cursor: default;
      opacity: 0.72;
      transform: none;
      box-shadow: 0 8px 20px rgba(28, 33, 27, 0.10);
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(182, 214, 235, 0.8);
      border-radius: 15px;
      background: var(--blue-soft);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .status.visible { display: block; }

    .device-wrap {
      display: flex;
      justify-content: center;
      margin-top: 23px;
    }

    .device {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink-soft), var(--blue-soft));
      color: var(--muted);
      font-size: 11px;
    }

    .device-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
    }

    .device strong {
      color: var(--ink);
      font-weight: 700;
    }

    .sprinkles {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 19px;
    }

    .sprinkle {
      width: 16px;
      height: 5px;
      border-radius: 999px;
      transform: rotate(-12deg);
    }

    .sprinkle:nth-child(1) { background: var(--pink); transform: rotate(15deg); }
    .sprinkle:nth-child(2) { background: var(--blue); transform: rotate(-12deg); }
    .sprinkle:nth-child(3) { background: var(--pink); transform: rotate(-20deg); }
    .sprinkle:nth-child(4) { background: var(--blue); transform: rotate(18deg); }

    .footer {
      margin: 17px 0 0;
      text-align: center;
      color: #7C837A;
      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 420px) {
      body {
        align-items: flex-start;
        padding-top: 14px;
      }

      .content { padding: 30px 22px 24px; }
      .card { border-radius: 23px; }
      .brand-name { font-size: 29px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="page-decoration" aria-hidden="true">
    <div class="blob blob-pink"></div>
    <div class="blob blob-blue"></div>
  </div>

  <main class="shell">
    <section class="card" aria-labelledby="welcome-title">
      <div class="accent-bar" aria-hidden="true">
        <div class="accent-pink"></div>
        <div class="accent-blue"></div>
      </div>

      <div class="content">
        <div class="brand" aria-label="Scoopy">
          <span class="brand-name">Scoopy</span>
        </div>

        <h1 id="welcome-title">Welcome to Scoopy!</h1>
        <p class="intro">Let's get your Scoopy connected to Wi-Fi.</p>

        <form id="wifi-form">
          <div class="field">
            <label for="wifi-network">Wi-Fi network</label>

            <select id="wifi-network" name="ssid">
              <option value="">Loading networks…</option>
            </select>

            <button class="manual" id="manual-toggle" type="button">
              Can't see your network?
            </button>

            <div class="manual-field" id="manual-field">
              <label for="manual-ssid">Network name</label>
              <input
                id="manual-ssid"
                type="text"
                autocomplete="off"
                placeholder="Enter Wi-Fi name"
              >
            </div>
          </div>

          <div class="field">
            <label for="wifi-password">Password</label>
            <input
              id="wifi-password"
              name="psk"
              type="password"
              autocomplete="current-password"
              placeholder="Wi-Fi password"
            >
          </div>

          <button class="connect" id="connect-button" type="submit">Connect Scoopy</button>
        </form>

        <div class="status" id="status" role="status" aria-live="polite">
          Connecting Scoopy… This page should close automatically.
        </div>

        <div class="device-wrap">
          <p class="device">
            <span class="device-dot" aria-hidden="true"></span>
            Device:
            <strong id="device-name">Scoopy</strong>
          </p>
        </div>

        <div class="sprinkles" aria-hidden="true">
          <span class="sprinkle"></span>
          <span class="sprinkle"></span>
          <span class="sprinkle"></span>
          <span class="sprinkle"></span>
        </div>
      </div>
    </section>

    <p class="footer">Scoopy Node · Open-source smart room control</p>
  </main>

  <script>
    const manualToggle = document.getElementById('manual-toggle');
    const manualField = document.getElementById('manual-field');
    const manualSsid = document.getElementById('manual-ssid');
    const networkSelect = document.getElementById('wifi-network');
    const wifiPassword = document.getElementById('wifi-password');
    const deviceName = document.getElementById('device-name');
    const form = document.getElementById('wifi-form');
    const status = document.getElementById('status');
    const connectButton = document.getElementById('connect-button');

    const localPreview = window.location.protocol === 'file:';

    const mockConfig = {
      name: 'scoopy-2176d8',
      aps: [
        { ssid: 'Home WiFi', rssi: -39, lock: true },
        { ssid: 'Kitchen 2.4 GHz', rssi: -58, lock: true },
        { ssid: 'Scoopy Test Network', rssi: -72, lock: false }
      ]
    };

    function showStatus(message) {
      status.textContent = message;
      status.classList.add('visible');
    }

    function populateNetworks(aps) {
      networkSelect.innerHTML = '';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choose a network';
      networkSelect.appendChild(placeholder);

      const uniqueNetworks = new Map();

      (aps || [])
        .filter(ap => ap && ap.ssid)
        .sort((a, b) => (b.rssi || -100) - (a.rssi || -100))
        .forEach(ap => {
          if (!uniqueNetworks.has(ap.ssid)) {
            uniqueNetworks.set(ap.ssid, ap);
          }
        });

      uniqueNetworks.forEach(ap => {
        const option = document.createElement('option');
        option.value = ap.ssid;
        option.textContent = ap.ssid;
        networkSelect.appendChild(option);
      });

      if (uniqueNetworks.size === 0) {
        placeholder.textContent = 'No networks found';
      }
    }

    async function loadConfig() {
      try {
        const config = localPreview
          ? mockConfig
          : await fetch('/config.json', { cache: 'no-store' }).then(response => {
              if (!response.ok) {
                throw new Error('Unable to load Scoopy configuration');
              }

              return response.json();
            });

        deviceName.textContent = config.name || 'Scoopy';
        populateNetworks(config.aps);
      } catch (error) {
        deviceName.textContent = 'Scoopy';
        networkSelect.innerHTML = '<option value="">Unable to scan networks</option>';
        showStatus('Scoopy could not load nearby Wi-Fi networks. You can still enter your network name manually.');
      }
    }

    manualToggle.addEventListener('click', () => {
      const visible = manualField.classList.toggle('visible');

      manualToggle.textContent = visible
        ? 'Choose from scanned networks'
        : "Can't see your network?";

      if (visible) {
        networkSelect.value = '';
        manualSsid.focus();
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const usingManualSsid = manualField.classList.contains('visible');
      const ssid = (usingManualSsid ? manualSsid.value : networkSelect.value).trim();
      const psk = wifiPassword.value;

      if (!ssid) {
        showStatus('Choose a Wi-Fi network or enter the network name manually.');
        return;
      }

      if (localPreview) {
        showStatus(`Preview mode: Scoopy would now connect to ${ssid}.`);
        return;
      }

      connectButton.disabled = true;
      connectButton.textContent = 'Connecting…';
      showStatus('Connecting Scoopy to Wi-Fi… This page should close automatically.');

      try {
        const params = new URLSearchParams({ ssid, psk });
        const response = await fetch(`/wifisave?${params.toString()}`, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('Wi-Fi settings were not accepted');
        }

        showStatus("Scoopy is connecting to Wi-Fi. This page should close automatically. If it doesn't, you can close it once the Scoopy setup network disappears.");
      } catch (error) {
        connectButton.disabled = false;
        connectButton.textContent = 'Connect Scoopy';
        showStatus('Scoopy could not connect using those Wi-Fi settings. Check the network name and password, then try again.');
      }
    });

    loadConfig();
  </script>
</body>
</html>
